<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFridge AI — Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 22px;
            box-shadow: 0 12px 32px rgba(22, 101, 52, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #166534;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: #ffffff;
            color: #1f2937;
            border: 1.5px solid #d1d5db;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .google-btn:hover {
            background: #f9fafb;
            border-color: #16a34a;
            transform: translateY(-1px);
        }
        .google-btn img {
            width: 22px;
            height: 22px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🧊 SmartFridge AI</div>
        <div class="subtitle">Soyuducundakı ərzaqlardan dərhal resept yaratmaq üçün Gmail hesabınla daxil ol</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <a href="{{ url_for('google_login') }}" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            <span>Google ilə davam et</span>
        </a>
    </div>
</body>
</html>
